<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Подтверждение Email — KnowHow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f4f7fb;
            padding: 40px 0;
        }
        .email-card {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }
        .inner-content {
            padding: 40px 36px 44px;
        }
        h1 {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            color: #1a2c3e;
            margin: 0 0 16px 0;
        }
        .code-block {
            background: #f0f4fa;
            border-radius: 20px;
            padding: 20px 24px;
            margin: 24px 0 28px;
            text-align: center;
            border: 1px solid #e6edf4;
        }
        p.code {
            font-family: 'Courier New', 'SF Mono', 'Fira Code', monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #0c4e6e;
            margin: 0;
            line-height: 1.2;
            word-break: break-word;
        }
        h2 {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
            color: #2c4c6c;
            margin: 20px 0 0 0;
        }
        .footer-note {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #eef2f8;
            font-size: 12px;
            color: #7c8ea0;
            text-align: center;
            font-family: Verdana, Geneva, sans-serif;
        }
        @media (max-width: 560px) {
            .inner-content {
                padding: 32px 24px 36px;
            }
            p.code {
                font-size: 30px;
                letter-spacing: 2px;
            }
        }
        @media (prefers-color-scheme: dark) {
            body, .email-wrapper {
                background-color: #1a2128;
            }
            .email-card {
                background: #242b33;
            }
            h1 {
                color: #eef3fc;
            }
            .code-block {
                background: #2d3640;
                border-color: #3c4854;
            }
            p.code {
                color: #c2dcf5;
            }
            h2 {
                color: #bfd6ec;
            }
            .footer-note {
                border-top-color: #2f3a46;
                color: #8fa0b2;
            }
        }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="email-card">
        <div class="inner-content">
            <h1>🔐 Your email verification code</h1>

            <div class="code-block">
                <p class="code">{{code}}</p>
            </div>

            <h2>Best regards, <span style="font-weight: 600; color: #1f6392;">KnowHow</span> Team!</h2>

            <div class="footer-note">
                If you didn't request this, you can safely ignore this email.
            </div>
        </div>
    </div>
</div>
</body>
</html>
